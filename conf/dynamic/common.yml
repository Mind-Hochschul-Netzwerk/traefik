http:
  middlewares:
    # Strips incoming Remote-User/Remote-Groups/Remote-Name/Remote-Email
    # headers so a client can never inject them directly. Services that use
    # Authelia's forward-auth pattern (trusting these headers for identity)
    # must put this middleware before the forwardauth middleware on every
    # router - including public ones - not just the protected router,
    # otherwise a request to an unprotected route bypasses forwardAuth
    # entirely and the spoofed headers reach the backend unfiltered.
    stripremoteauth:
      headers:
        customRequestHeaders:
          Remote-User: ""
          Remote-Groups: ""
          Remote-Name: ""
          Remote-Email: ""
    secheader:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        forceSTSHeader: true
        contentSecurityPolicy: "frame-ancestors https://*.mind-hochschul-netzwerk.de https://*.localhost"
        accessControlMaxAge: 100
        addVaryHeader: true
        accessControlAllowMethods: GET,OPTIONS,PUT
        accessControlAllowOriginListRegex:
          - '^https://([a-z0-9-]+\.)*mind-hochschul-netzwerk\.de$'
          - '^https://([a-z0-9-]+\.)*localhost$'
    default:
      chain:
        middlewares:
          - stripremoteauth
          - secheader
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - CurveP521
        - CurveP384
